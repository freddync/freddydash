name: Actualizar historia de precios

# Rehace los ~7 años de precios una vez al mes (día 1, 06:00 UTC), para que el archivo reciente
# (3 meses) siempre se solape con la historia. También se puede lanzar a mano desde Actions.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar
        run: |
          pip install requests pandas pyarrow
          python scripts/actualizar_precios.py historia
          python scripts/actualizar_precios.py reciente

      - name: Publicar
        run: |
          git add datos/precios
          if git diff --cached --quiet; then echo "Nada cambió: no se publica."; exit 0; fi
          git add datos/actualizacion.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Historia de precios $(date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 15; done
          exit 1
